server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        try_files $uri $uri/ =404;
    }

    location /demo/ {
        alias /usr/share/nginx/html/demo/;
        try_files $uri $uri/ /demo/index.html;
    }

    location / {
        return 302 /docs/;
    }
}
